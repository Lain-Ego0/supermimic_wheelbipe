[project]
name = "supermimic-wheelbipe"
version = "0.2.0"
description = "SuperMimic wheel-legged control with MJLab and MuJoCo Warp"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.6.0",
  "mjviser==0.0.16",
  "torch==2.10.0",
  "usd-core==26.11",
  "imageio>=2.37",
  "pynput>=1.8.2",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
